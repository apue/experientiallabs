[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experientiallabs-cli"
version = "0.1.0"
description = "Read-only Experiential Labs usage, costs and quota CLI"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
explabs = "explabs.cli:main"

[tool.setuptools.packages.find]
include = ["explabs*"]
